    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background: #06162d;
            min-height: 100vh;
            overflow-x: hidden;
        }

        #painted-sky {
            position: fixed;
            inset: -3%;
            width: 106%;
            height: 106%;
            z-index: 0;
            pointer-events: none;
            filter: saturate(1.18) contrast(1.05);
            animation: sky-breathe 18s ease-in-out infinite alternate;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background:
                radial-gradient(ellipse at center, transparent 24%, rgba(2,8,23,.18) 67%, rgba(2,6,23,.66) 100%),
                linear-gradient(to bottom, rgba(3,17,43,.08), rgba(2,8,23,.32));
        }
        @keyframes sky-breathe {
            from { transform: scale(1) translate3d(0,0,0); }
            to { transform: scale(1.025) translate3d(-.4%,.25%,0); }
        }
        
        .font-serif-custom {
            font-family: 'Playfair Display', serif;
        }

        /* Starry Night floating background particles */
        .star {
            position: absolute;
            background: #fde047;
            border-radius: 50%;
            animation: twinkle var(--duration) ease-in-out infinite alternate;
            opacity: 0.8;
            pointer-events: none;
        }

        @keyframes twinkle {
            0% { transform: scale(0.8); opacity: 0.3; box-shadow: 0 0 2px #eab308; }
            100% { transform: scale(1.3); opacity: 1; box-shadow: 0 0 12px #fde047, 0 0 20px #eab308; }
        }

        /* Book wrapper & perspective */
        .book-container {
            perspective: 2000px;
            width: 100%;
            max-width: 1000px;
            height: 620px;
            margin: auto;
        }

        .book {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
        }

        /* Page styling */
        .page {
            position: absolute;
            width: 50%;
            height: 100%;
            top: 0;
            transform-style: preserve-3d;
            transform-origin: left center;
            transition: transform 1s cubic-bezier(0.645, 0.045, 0.355, 1), box-shadow 0.5s ease;
            background: #f0f7ff; /* Pastel light blue */
            color: #1e3a8a;
            box-shadow: inset 0 0 30px rgba(14, 116, 144, 0.1);
            user-select: none;
            overflow: hidden;
            backface-visibility: hidden;
        }

        .page.left {
            left: 0;
            transform-origin: right center;
            border-radius: 16px 0 0 16px;
            border-right: 2px solid rgba(14, 116, 144, 0.15);
        }

        .page.right {
            left: 50%;
            transform-origin: left center;
            border-radius: 0 16px 16px 0;
            border-left: 2px solid rgba(14, 116, 144, 0.15);
        }

        /* Flipping page states */
        .page.fipping {
            pointer-events: none;
        }

        /* Custom scrollbar for page content */
        .page-content {
            height: 100%;
            overflow: hidden;
            padding: 2.25rem 2rem;
            box-sizing: border-box;
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* Nội dung các section được co gọn để luôn nằm vừa một trang sách. */
        .page-content > .space-y-6 { gap: 1.15rem; }
        .page-content > .space-y-5 { gap: 1rem; }
        .page-content > .space-y-4 { gap: .8rem; }
        .page-content::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }

        /* Van Gogh Brushstroke card backgrounds */
        .vangogh-card {
            background: linear-gradient(135deg, rgba(224, 242, 254, 0.9) 0%, rgba(186, 230, 253, 0.7) 100%);
            border: 1px solid rgba(56, 189, 248, 0.3);
            box-shadow: 0 4px 15px rgba(14, 165, 233, 0.08);
            transition: all 0.3s ease;
        }
        .vangogh-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(14, 165, 233, 0.15);
            border-color: rgba(56, 189, 248, 0.6);
        }

        /* Cover special styling */
        .book-cover {
            background: linear-gradient(135deg, #0c4a6e 0%, #0369a1 50%, #1e40af 100%);
            color: #fef08a;
            position: relative;
        }
        .book-cover::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 70% 30%, rgba(253, 224, 71, 0.15) 0%, transparent 60%);
            pointer-events: none;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .book-container {
                height: 75vh;
                max-width: 95vw;
            }
            .page-content {
                padding: 1.5rem 1rem;
            }

/* ===== REALISTIC BOOK FLIP OVERRIDES ===== */
.book-container {
    perspective: 2400px;
    transform-style: preserve-3d;
    position: relative;
}
.book {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: none;
}

/* Each .book-sheet is a physical sheet: front = right page, back = left page. */
.book-sheet {
    position: absolute;
    left: 50%;
    top: 0;
    width: 50%;
    height: 100%;
    transform-style: preserve-3d;
    transform-origin: left center;
    transition: transform 1.05s cubic-bezier(.645,.045,.355,1);
    cursor: pointer;
    will-change: transform;
}
.book-sheet.flipped {
    transform: rotateY(-180deg);
}
.book-face {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    background: #f0f7ff;
    color: #1e3a8a;
    box-shadow: inset 0 0 30px rgba(14,116,144,.10);
    border-radius: 0 16px 16px 0;
    border-left: 2px solid rgba(14,116,144,.15);
}
.book-face.back {
    transform: rotateY(180deg);
    border-radius: 16px 0 0 16px;
    border-left: 0;
    border-right: 2px solid rgba(14,116,144,.15);
}

/* Subtle paper shading near the spine and page edge. */
.book-face::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 20;
    background: linear-gradient(90deg,
        rgba(15,23,42,.16) 0,
        rgba(255,255,255,0) 10%,
        rgba(255,255,255,0) 88%,
        rgba(15,23,42,.06) 100%);
    opacity: .55;
}
.book-face.back::before {
    background: linear-gradient(90deg,
        rgba(15,23,42,.06) 0,
        rgba(255,255,255,0) 12%,
        rgba(255,255,255,0) 90%,
        rgba(15,23,42,.16) 100%);
}

.book-face .page-content {
    position: relative;
    z-index: 1;
}

/* Give the book a visible center crease and a soft drop shadow. */
.book-container::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 1%;
    bottom: 1%;
    width: 18px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 50;
    background: linear-gradient(90deg,
        rgba(15,23,42,0),
        rgba(15,23,42,.10),
        rgba(255,255,255,.22),
        rgba(15,23,42,.08),
        rgba(15,23,42,0));
    opacity: .5;
}
.book-container {
    filter: drop-shadow(0 24px 30px rgba(0,0,0,.32));
}

@media (max-width: 768px) {
    .book-container { height: 75vh; }
    .book-face .page-content { padding: 1.25rem .9rem; }
}

    
/* ===== FINAL FLIPBOOK FIXES ===== */
.book-face.book-cover {

        function generatePaintedSky() {
            const canvas = document.getElementById('painted-sky');
            const ctx = canvas.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 1.6);

            function paint() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                canvas.width = Math.round(w * dpr);
                canvas.height = Math.round(h * dpr);
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

                const sky = ctx.createLinearGradient(0, 0, 0, h);
                sky.addColorStop(0, '#071b46');
                sky.addColorStop(.42, '#0b3d73');
                sky.addColorStop(.74, '#125d86');
                sky.addColorStop(1, '#07182e');
                ctx.fillStyle = sky;
                ctx.fillRect(0, 0, w, h);

                // Broad layered brush currents.
                const bands = [
                    ['rgba(49,126,175,.28)', .16, 34, 0],
                    ['rgba(112,180,199,.22)', .29, 27, 1.7],
                    ['rgba(23,83,145,.42)', .47, 42, 3.1],

                    ctx.lineWidth = width;
                    ctx.lineCap = 'round';

                ];

                ctx.beginPath(); ctx.moveTo(0,h);
                for(let x=0;x<=w;x+=20){
                    const y=h*.82-Math.sin(x/92)*19-Math.sin(x/38)*7;
                    ctx.lineTo(x,y);
                }
                ctx.lineTo(w,h); ctx.closePath();
                const land=ctx.createLinearGradient(0,h*.78,0,h);
                land.addColorStop(0,'rgba(4,27,44,.82)'); land.addColorStop(1,'#020817');
                ctx.fillStyle=land; ctx.fill();
            }

            paint();
            let resizeTimer;
            window.addEventListener('resize', () => {
                clearTimeout(resizeTimer);
                resizeTimer = setTimeout(paint, 120);
            });
        }

        function generateStarryBackground() {
            const bg = document.getElementById('starry-bg');
            const starCount = 35;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 3 + 1.5;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.animationDelay = `${Math.random() * 3}s`;
                bg.appendChild(star);
            }
        }

        function generateSnowfall() {
            const layer = document.getElementById('snowfall');
            if (!layer || layer.children.length || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;

            const snowCount = window.matchMedia('(max-width: 768px), (hover: none) and (pointer: coarse)').matches ? 24 : 42;
            const symbols = ['❄', '❅', '•'];

            for (let i = 0; i < snowCount; i++) {
                const flake = document.createElement('span');
                const size = Math.random() * 12 + 7;
                flake.className = 'snowflake';
                flake.textContent = symbols[Math.floor(Math.random() * symbols.length)];
                flake.style.left = `${Math.random() * 100}%`;
                flake.style.fontSize = `${size}px`;
                flake.style.setProperty('--snow-duration', `${Math.random() * 9 + 10}s`);
                flake.style.setProperty('--snow-delay', `${Math.random() * -18}s`);
                flake.style.setProperty('--snow-drift', `${Math.random() * 120 - 60}px`);
                flake.style.setProperty('--snow-opacity', `${Math.random() * .45 + .35}`);
                layer.appendChild(flake);
            }
        }

        function pageHTML(number, title, content, side = "right") {
            const header = `
                <div class="flex justify-between items-center mb-2 text-xs text-sky-500 font-semibold border-b border-sky-200 pb-1">
                    <span>${side === "left" ? `Trang ${number}` : title}</span>
                    <span>${side === "left" ? title : `Trang ${number}`}</span>
                </div>`;
            return `<div class="page-content">${header}${content}</div>`;
        }

        function coverHTML(label, title, subtitle, icon, isBack = false) {
            if (isBack) {
                return `
                    <div class="book-face back book-cover shadow-2xl" aria-label="Bìa sau trống">
                        <div class="cover-age-marks" aria-hidden="true"></div>
                    </div>`;
            }
            return `
                <div class="book-face book-cover flex flex-col justify-between p-8 md:p-12 shadow-2xl">
                    <div class="cover-age-marks" aria-hidden="true"></div>
                    <div class="absolute inset-0 opacity-10 bg-[radial-gradient(#fde047_1px,transparent_1px)] [background-size:16px_16px]"></div>
                    <div class="relative z-10 text-left text-xs uppercase tracking-widest text-amber-200 font-semibold border-b border-amber-300/30 pb-1">
                        ${label}
                    </div>
                    <div class="relative z-10 my-auto text-center py-6">
                        <div class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber-400/20 border-2 border-amber-300/60 flex items-center justify-center text-amber-300 text-2xl">
                            <i class="${icon}"></i>
                        </div>
                        <h4 class="text-2xl font-serif-custom font-bold text-amber-200 mb-2">${title}</h4>
                        <p class="text-xs text-sky-200/80">${subtitle}</p>
                    </div>
                    <div class="relative z-10 text-xs text-sky-300/80 border-t border-sky-600/50 pt-4 flex justify-between">
                        <span>No Pain No Gain</span>
                        <span>1860</span>
                    </div>
                </div>`;
        }

        function liningHTML(isBack = false) {
            return `<div class="book-face ${isBack ? 'back' : ''} cover-lining" aria-label="Mặt trong bìa da nâu"></div>`;
        }

        function mobileOutsideBackCoverHTML() {
            return `
                <div class="book-face book-cover mobile-back-cover shadow-2xl" aria-label="Mặt ngoài bìa sau">
                    <div class="cover-age-marks" aria-hidden="true"></div>
                </div>`;
        }

        function makeSheet(index) {
            const sheet = document.createElement('div');
            sheet.className = 'book-sheet';
            sheet.dataset.sheet = index;

            let front, back;

            if (index === 0) {
                // Sheet 0: front cover -> blank blue inside cover.
                front = coverHTML(
                    'Thông tin của mình',
                    'ĐÀO THỊ THÙY GIANG',
                    'Đêm đầy sao không chỉ ở trên bầu trời, mà còn ẩn chứa trong khát vọng của tuổi trẻ.',
                    'fa-solid fa-palette'
                );
                back = liningHTML(true);
            } else if (index === 1) {
                // First paper sheet: opening page -> page 1.
                front = `<div class="book-face">${pageHTML(1, 'Lời Mở Đầu', pagesData[0].html)}</div>`;
                back = `<div class="book-face back">${pageHTML(2, 'Giới Thiệu Chung', pagesData[1].html, 'left')}</div>`;
            } else if (index === 2) {
                front = `<div class="book-face">${pageHTML(3, 'Học Tập', pagesData[2].html)}</div>`;
                back = `<div class="book-face back">${pageHTML(4, 'Sở Thích & CLB', pagesData[3].html, 'left')}</div>`;
            } else if (index === 3) {
                front = `<div class="book-face">${pageHTML(5, 'Dự Án Nổi Bật', pagesData[4].html)}</div>`;
                back = `<div class="book-face back">${pageHTML(6, 'Contact', pagesData[5].html, 'left')}</div>`;
            } else {
                // Last physical sheet: blank blue inside cover -> back cover.
                front = liningHTML(false);
                back = coverHTML(
                    'Bìa sau',
                    'Hết Sách',
                    'Cảm ơn bạn đã ghé thăm không gian nghệ thuật của Nguyễn Minh Châu.',
                    'fa-solid fa-star',
                    true
                );
            }

            sheet.innerHTML = front + back;
            return sheet;
        }

        function makeMobileLeaf(index) {
            const leaf = document.createElement('div');
            leaf.className = 'mobile-leaf';
            leaf.dataset.page = index;

            let face;
            if (index === 0) {
                face = coverHTML(
                    'Thông tin của mình',
                    'ĐÀO THỊ THÙY GIANG',
                    'Đêm đầy sao không chỉ ở trên bầu trời, mà còn ẩn chứa trong khát vọng của tuổi trẻ.',
                    'fa-solid fa-palette'
                );
            } else if (index >= 1 && index <= 6) {
                const titles = [
                    'Lời Mở Đầu',
                    'Giới Thiệu Chung',
                    'Học Vấn & Trường Học',
                    'Sở Thích & CLB',
                    'Dự Án Nổi Bật',
                    'Lời Kết & Liên Hệ'
                ];
                face = `<div class="book-face">${pageHTML(index, titles[index - 1], pagesData[index - 1].html)}</div>`;
            } else {
                // Mobile ends on the true outside of the back cover, never its lining.
                face = mobileOutsideBackCoverHTML();
            }

            leaf.innerHTML = face;
            return leaf;
        }

        function getLeaves() {
            return [...document.querySelectorAll(mobileMode ? '.mobile-leaf' : '.book-sheet')];
        }

        function lastPageIndex() {
            return mobileMode ? MOBILE_LAST_PAGE : TOTAL_SHEETS;
        }

        function updateMobileScale() {
            if (!mobileMode) return;
            const container = document.getElementById('book-container');
            const scale = container.clientWidth / 500;
            container.style.setProperty('--mobile-book-scale', String(scale));
            // Keep the leather backing exactly as tall as the scaled 500x620 book.
            // Explicit height avoids an iOS Safari aspect-ratio/auto-height mismatch.
            container.style.setProperty('height', `${620 * scale}px`, 'important');
        }

        function settleLayers(raisedSheet = null) {
            const sheets = getLeaves();
            const total = sheets.length;
            const raisedIndex = raisedSheet ? sheets.indexOf(raisedSheet) : -1;
            sheets.forEach((sheet, i) => {
                if (sheet === raisedSheet) sheet.style.zIndex = String(total + 5);
                else if (i < currentPageIndex) sheet.style.zIndex = String(i + 1);
                else sheet.style.zIndex = String(total - i + 1);

                if (mobileMode) {
                    // iOS/Safari can briefly composite the last DOM leaf above the
                    // intended page around 90deg. Only keep the active transition
                    // pair visible so no later page can flash through.
                    const isCurrent = i === currentPageIndex;
                    const isTurning = sheet === raisedSheet;
                    const isForwardTarget = raisedIndex === currentPageIndex && i === currentPageIndex + 1;
                    const shouldShow = isCurrent || isTurning || isForwardTarget;
                    sheet.style.visibility = shouldShow ? 'visible' : 'hidden';
                    sheet.style.pointerEvents = shouldShow ? 'auto' : 'none';
                } else {
                    sheet.style.visibility = 'visible';
                    sheet.style.pointerEvents = '';
                }
            });
        }

        function syncBookState() {
            const container = document.getElementById('book-container');
            const isClosed = currentPageIndex === 0 || currentPageIndex === lastPageIndex();
            container.classList.toggle('closed', isClosed);
            container.classList.toggle('opened', !isClosed);
        }

        function renderBook() {
            const bookEl = document.getElementById('book');
            bookEl.innerHTML = '';

            if (mobileMode) {
                currentPageIndex = Math.min(currentPageIndex, MOBILE_LAST_PAGE);
                for (let i = 0; i <= MOBILE_LAST_PAGE; i++) {
                    const leaf = makeMobileLeaf(i);
                    if (i < currentPageIndex) leaf.classList.add('turned');
                    bookEl.appendChild(leaf);
                }
                requestAnimationFrame(updateMobileScale);
            } else {
                const container = document.getElementById('book-container');
                container.style.removeProperty('height');
                container.style.removeProperty('--mobile-book-scale');
                currentPageIndex = Math.min(currentPageIndex, TOTAL_SHEETS);
                // The currently active sheet must be above the sheets behind it.
                for (let i = 0; i < TOTAL_SHEETS; i++) {
                    const sheet = makeSheet(i);
                    if (i < currentPageIndex) sheet.classList.add('flipped');
                    bookEl.appendChild(sheet);
                }
            }
            settleLayers();
            bindBookLinks();
            bindDragEvents();
            syncBookState();
            updateNavigation();
            bookEl.classList.add('book-ready');
        }

        function preparePageTurnSound() {
            if (pageTurnAudio) return;
            pageTurnAudio = new Audio(PAGE_TURN_AUDIO_SRC);
            pageTurnAudio.preload = 'auto';
            pageTurnAudio.volume = .55;
            pageTurnAudio.load();
        }

        function playPageTurnSegment(startTime, endTime) {
            try {
                preparePageTurnSound();
                clearTimeout(pageTurnStopTimer);
                pageTurnAudio.pause();
                pageTurnAudio.currentTime = startTime;
                pageTurnAudio.play().catch(() => {});
                pageTurnStopTimer = setTimeout(() => {
                    if (pageTurnAudio) pageTurnAudio.pause();
                }, Math.max(80, (endTime - startTime) * 1000));
            } catch (_) {
                // Page turning remains fully usable when audio is unavailable.
            }
        }

        function playPageOpeningSound() {
            playPageTurnSegment(.7, 1.30);
        }

        function playPageClosingSound() {
            playPageTurnSegment(1.30, 1.62);
        }

        function playPageTurnSound() {
            playPageTurnSegment(.7, 1.62);
        }

        function nextPage(skipSound = false) {
            if (currentPageIndex >= lastPageIndex()) return;
            if (!skipSound) playPageTurnSound();
            currentPageIndex++;

            const sheets = getLeaves();
            const sheet = sheets[currentPageIndex - 1];
            if (sheet) {
                sheet.classList.add(mobileMode ? 'turned' : 'flipped');
                settleLayers(sheet);
                clearTimeout(animationTimer);
                animationTimer = setTimeout(() => settleLayers(), 1080);
            }
            syncBookState();
            updateNavigation();
        }

        function prevPage(skipSound = false) {
            if (currentPageIndex <= 0) return;
            if (!skipSound) playPageTurnSound();
            currentPageIndex--;

            const sheets = getLeaves();
            const sheet = sheets[currentPageIndex];
            if (sheet) {
                settleLayers(sheet);
                sheet.classList.remove(mobileMode ? 'turned' : 'flipped');
                clearTimeout(animationTimer);
                animationTimer = setTimeout(() => settleLayers(), 1080);
            }
            syncBookState();
            updateNavigation();
        }

        function pointerProgress(event, state) {
            const dx = event.clientX - state.startX;
            return state.direction === 'forward' ? Math.max(0, Math.min(1, -dx / state.width)) : Math.max(0, Math.min(1, dx / state.width));
        }

        function startDrag(event) {
            if (event.button !== undefined && event.button !== 0) return;
            if (event.target.closest('a, button') || dragState) return;
            const textSelector = '.page-content p, .page-content h1, .page-content h2, .page-content h3, .page-content h4, .page-content h5, .page-content h6, .page-content span, .page-content li, .page-content strong, .page-content em, .page-content blockquote, .page-content code';
            if (event.target.closest(textSelector)) return;
            const sheets = getLeaves();
            const rect = document.getElementById('book-container').getBoundingClientRect();
            const onRight = event.clientX >= rect.left + rect.width / 2;
            let direction, sheetIndex;
            if (onRight && currentPageIndex < lastPageIndex()) { direction='forward'; sheetIndex=currentPageIndex; }
            else if (!onRight && currentPageIndex > 0) { direction='backward'; sheetIndex=currentPageIndex-1; }
            else return;
            const sheet = sheets[sheetIndex];
            dragState = {
                pointerId:event.pointerId,
                direction,
                sheetIndex,
                sheet,
                startX:event.clientX,
                lastX:event.clientX,
                lastTime:event.timeStamp || performance.now(),
                dragSpeed:0,
                width:Math.max(220, mobileMode ? rect.width : rect.width/2),
                progress:0,
                openingSoundPlayed:false
            };
            sheet.classList.add('dragging');
            settleLayers(sheet);
            sheet.setPointerCapture?.(event.pointerId);
            event.preventDefault();
        }

        function moveDrag(event) {
            if (!dragState || event.pointerId !== dragState.pointerId) return;
            dragState.progress = pointerProgress(event, dragState);
            const eventTime = event.timeStamp || performance.now();
            const elapsed = Math.max(1, eventTime - dragState.lastTime);
            const instantSpeed = Math.abs(event.clientX - dragState.lastX) / elapsed;
            dragState.dragSpeed = dragState.dragSpeed * .65 + instantSpeed * .35;
            dragState.lastX = event.clientX;
            dragState.lastTime = eventTime;

            // Very slow paper movement stays quiet; a natural pull starts the opening rustle.
            if (!dragState.openingSoundPlayed && dragState.progress > .02 && dragState.dragSpeed > .16) {
                playPageOpeningSound();
                dragState.openingSoundPlayed = true;
            }
            const angle = dragState.direction === 'forward' ? -180*dragState.progress : -180+180*dragState.progress;
            dragState.sheet.style.transform = `rotateY(${angle}deg)`;
            event.preventDefault();
        }

        function endDrag(event) {
            if (!dragState || event.pointerId !== dragState.pointerId) return;
            const state = dragState;
            dragState = null;
            state.sheet.classList.remove('dragging');
            state.sheet.style.transform = '';
            if (state.progress > .015) playPageClosingSound();
            if (state.progress > .32) {
                if (state.direction === 'forward') nextPage(true); else prevPage(true);
            } else settleLayers();
        }

        function bindDragEvents() {
            const bookEl = document.getElementById('book');
            if (bookEl.dataset.dragBound === 'true') return;
            bookEl.dataset.dragBound = 'true';
            bookEl.addEventListener('pointerdown', startDrag);
            bookEl.addEventListener('pointermove', moveDrag);
            bookEl.addEventListener('pointerup', endDrag);
            bookEl.addEventListener('pointercancel', endDrag);
        }

        function bindBookLinks() {
            document.querySelectorAll('#book a[href]').forEach(link => {
                link.setAttribute('draggable', 'false');
                if (link.dataset.linkBound === 'true') return;
                link.dataset.linkBound = 'true';

                // A link click must never be interpreted as a page-drag gesture.
                link.addEventListener('pointerdown', event => event.stopPropagation());
                link.addEventListener('pointermove', event => event.stopPropagation());
                link.addEventListener('pointerup', event => event.stopPropagation());
                link.addEventListener('click', event => event.stopPropagation());
            });
        }

        function updateNavigation() {
            const prevBtn = document.getElementById('prev-btn');
            const nextBtn = document.getElementById('next-btn');
            const indicator = document.getElementById('page-indicator');

            prevBtn.disabled = currentPageIndex === 0;
            nextBtn.disabled = currentPageIndex === lastPageIndex();

            const labels = mobileMode
                ? ["Bìa sách", "Trang 1", "Trang 2", "Trang 3", "Trang 4", "Trang 5", "Trang 6", "Bìa sau"]
                : ["Bìa sách", "Trang 1", "Trang 2 | Trang 3", "Trang 4 | Trang 5", "Trang 6", "Bìa sau"];
            indicator.textContent = labels[currentPageIndex];
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowRight') nextPage();
            if (e.key === 'ArrowLeft') prevPage();
        });

        window.onload = function() {
            generatePaintedSky();
            generateStarryBackground();
            generateSnowfall();
            preparePageTurnSound();
            renderBook();

            let layoutTimer;
            window.addEventListener('resize', () => {
                clearTimeout(layoutTimer);
                layoutTimer = setTimeout(() => {
                    const nextMobileMode = window.matchMedia(MOBILE_MEDIA_QUERY).matches;
                    if (nextMobileMode !== mobileMode) {
                        mobileMode = nextMobileMode;
                        currentPageIndex = 0;
                        renderBook();
                    } else {
                        updateMobileScale();
                    }
                }, 120);
            });
        };

    </script>
</body>
</html>
